<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         PRIMARY SEO: Title & Meta Description
         Google weighs the <title> heavily for brand queries.
         "Pratyush Jaiswal" appears first → max keyword weight.
    ═══════════════════════════════════════════════ -->
    <title>Pratyush Jaiswal — Frontend Developer</title>
    <meta name="description" content="Pratyush Jaiswal is a frontend developer in Bengaluru building fast, expressive web interfaces — tech-fest sites, real-time game platforms and developer tools — with React, TypeScript and motion." />
    <meta name="keywords" content="Pratyush Jaiswal, pratyush jaiswal portfolio, frontend developer, React developer, UI engineer, web developer, Next.js, TypeScript, Framer Motion, RVITM, Bengaluru" />
    <meta name="author" content="Pratyush Jaiswal" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- ═══════════════════════════════════════════════
         CANONICAL URL — prevents duplicate content penalty.
         Update this to your live Vercel domain.
    ═══════════════════════════════════════════════ -->
    <link rel="canonical" href="https://pratyushjaiswal.vercel.app/" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH — controls how link appears on LinkedIn,
         WhatsApp, Facebook etc. (social signals help rankings)
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pratyushjaiswal.vercel.app/" />
    <meta property="og:title" content="Pratyush Jaiswal — Frontend Developer" />
    <meta property="og:description" content="Frontend developer in Bengaluru building fast, expressive web interfaces — tech-fest sites, real-time game platforms and developer tools." />
    <meta property="og:image" content="https://pratyushjaiswal.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pratyush Jaiswal — Frontend Developer" />
    <meta property="og:site_name" content="Pratyush Jaiswal Portfolio" />
    <meta property="og:locale" content="en_IN" />

    <!-- ═══════════════════════════════════════════════
         TWITTER / X CARDS — rich preview on Twitter/X
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@pratyushjaiswal" />
    <meta name="twitter:creator" content="@pratyushjaiswal" />
    <meta name="twitter:title" content="Pratyush Jaiswal — Frontend Developer" />
    <meta name="twitter:description" content="Frontend developer in Bengaluru building fast, expressive web interfaces." />
    <meta name="twitter:image" content="https://pratyushjaiswal.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Pratyush Jaiswal — Frontend Developer" />

    <!-- ═══════════════════════════════════════════════
         JSON-LD STRUCTURED DATA (Person Schema)
         This generates a Knowledge Panel on Google and
         enables rich results for name searches.
    ═══════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Pratyush Jaiswal",
      "givenName": "Pratyush",
      "familyName": "Jaiswal",
      "jobTitle": "Frontend Developer",
      "description": "Frontend developer and Computer Science student at RVITM Bengaluru, building fast, expressive web interfaces with React, TypeScript, Next.js and motion.",
      "url": "https://pratyushjaiswal.vercel.app/",
      "image": "https://pratyushjaiswal.vercel.app/og-image.png",
      "email": "pratyushjaiswal0806@gmail.com",
      "telephone": "+918770953990",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bangalore",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "R V Institute of Technology and Management",
        "alternateName": "RVITM",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bangalore",
          "addressRegion": "Karnataka",
          "addressCountry": "IN"
        }
      },
      "knowsAbout": [
        "Frontend Development",
        "React.js",
        "TypeScript",
        "Next.js",
        "Tailwind CSS",
        "Framer Motion",
        "Web Animation",
        "UI Engineering",
        "Supabase",
        "Web Performance"
      ],
      "sameAs": [
        "https://github.com/pratyushjaiswal0806-dot",
        "https://www.linkedin.com/in/pratyush-jaiswal-ba0b6926a"
      ],
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": "https://pratyushjaiswal.vercel.app/"
      }
    }
    </script>

    <!-- ═══════════════════════════════════════════════
         PERFORMANCE: Preconnect critical origins to
         reduce LCP (Largest Contentful Paint)
    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══════════════════════════════════════════════
         FONTS — display=swap prevents FOIT (Flash of
         Invisible Text), improving CLS score
    ═══════════════════════════════════════════════ -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- ═══════════════════════════════════════════════
         FAVICON & THEME
    ═══════════════════════════════════════════════ -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Paint the canvas colour before the CSS bundle arrives -->
    <style>
      html, body { background-color: #0B0D10; color: #EAEAF0; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
